
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://api-236455.onrender.com;
        proxy_ssl_server_name on;
        proxy_ssl_name api-236455.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header Host api-236455.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass https://api-236455.onrender.com/health;
        proxy_ssl_server_name on;
        proxy_ssl_name api-236455.onrender.com;
        proxy_set_header Host api-236455.onrender.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
